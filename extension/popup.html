<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkApply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1e293b;
    }

    .header {
      background: #1e293b;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo { font-size: 18px; }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 10px; opacity: 0.6; margin-left: auto; }

    .body { padding: 14px 16px; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .kpi {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }

    .kpi-value {
      font-size: 18px;
      font-weight: 700;
      color: #6366f1;
      line-height: 1;
    }

    .kpi-label {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 3px;
    }

    .divider {
      border: none;
      border-top: 1px solid #f1f5f9;
      margin: 12px 0;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .match-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f8fafc;
    }

    .match-item:last-child { border-bottom: none; }

    .match-score {
      font-size: 15px;
      font-weight: 700;
      color: #6366f1;
      width: 38px;
      text-align: right;
      flex-shrink: 0;
    }

    .match-info { flex: 1; min-width: 0; }

    .match-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-company {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tier-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-strong { background: #22c55e; }
    .dot-good   { background: #3b82f6; }
    .dot-stretch{ background: #f59e0b; }
    .dot-none   { background: #cbd5e1; }

    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #6366f1; color: #fff; margin-bottom: 6px; }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; margin-top: 6px; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      color: #94a3b8;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #dc2626; font-size: 11px; padding: 8px; text-align: center; }

    .not-configured {
      padding: 16px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .not-configured a {
      color: #6366f1;
      text-decoration: none;
      font-weight: 500;
    }

    .pipeline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pipeline-status { font-size: 11px; color: #64748b; }

    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      transition: opacity 0.15s;
    }
    .btn-sm:hover { opacity: 0.8; }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-logo">🦅</span>
    <span class="header-title">HawkApply</span>
    <span class="header-sub" id="last-scraped"></span>
  </div>

  <div id="main">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Loading…</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
